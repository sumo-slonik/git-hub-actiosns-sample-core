# Nazwa workflow - wyświetlana w zakładce "Actions" na GitHubie.
name: Tests

# Eventy, które uruchamiają (trigerują) workflow.
on:
  # każdy push na główny branch
  push:
    branches: [main]
  # każdy pull request (utworzenie, nowy commit w PR itd.) - dzięki temu testy
  # odpalają się ZANIM zmiana trafi do main; można to potem wymusić regułą w "Rulesets"
  pull_request:
  # przycisk "Run workflow" w zakładce Actions - ręczne uruchomienie
  workflow_dispatch:

# Minimalne uprawnienia tokenu GITHUB_TOKEN - workflow tylko czyta kod.
permissions:
  contents: read

# Gdy wypchniemy kolejny commit na ten sam branch/PR, poprzednie (już nieaktualne)
# uruchomienie zostanie anulowane - oszczędzamy minuty.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Joby wykonywane w ramach workflow - domyślnie uruchamiają się równolegle.
jobs:
  # nazwa (id) pierwszego joba
  frontend:
    # maszyna (runner), na której uruchamiany jest job
    runs-on: ubuntu-latest
    # katalog, w którym wykonywane są wszystkie polecenia "run" w tym jobie
    defaults:
      run:
        working-directory: frontend
    steps:
      # "uses" wskazuje gotową akcję - w rzeczywistości jest to repozytorium na GitHubie:
      # https://github.com/actions/checkout (@v7 to wersja akcji).
      # checkout pobiera kod naszego repozytorium na maszynę runnera.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Gotowe akcje przyspieszają konfigurację podstawowych kroków - tu instalacja Node.js.
      # Po "with:" podajemy argumenty akcji. "cache: npm" zapamiętuje pobrane paczki między uruchomieniami.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # "run" wykonuje polecenia w konsoli.
      # npm ci instaluje dokładnie te wersje, które są w package-lock.json (powtarzalny build).
      - name: Install dependencies
        run: npm ci

      # Na GitHub Actions zmienna CI=true jest ustawiona automatycznie,
      # więc testy uruchomią się raz (bez trybu "watch").
      - name: Run tests
        run: npm test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Instalacja JDK. "temurin" to darmowa dystrybucja OpenJDK od Eclipse Adoptium
      # (dawne "adopt" jest przestarzałe).
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Oficjalna akcja Gradle: cache zależności i automatyczna weryfikacja,
      # czy gradle-wrapper.jar w repozytorium nie został podmieniony.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Używamy Gradle Wrappera (./gradlew) z repozytorium - dzięki temu CI buduje
      # projekt dokładnie tą samą wersją Gradle co my lokalnie.
      - name: Build and run tests
        run: ./gradlew build

      # Gdy testy nie przejdą, zapisujemy raport HTML z testów jako artefakt,
      # który można pobrać z podsumowania uruchomienia workflow.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
